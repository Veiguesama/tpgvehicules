const MAX_PLACES = Math.max(...VEHICLES.map(v=>v.places||0),1);
let query='', activeOperator=null, activeType=null, sortMode='parc', showRetired=false;
const DEPOTS={CMB:'Bachet (CMB)',CMC:'En Chardon (CMC)',CMJ:'Jonction (CMJ)'};
const isRetired=v=>/^(Déclassé|Vendu)/.test(v.statut||'');
function statusClass(st){st=st||''; if(st==='En service')return 'st-ok'; if(st==='En location TPG')return 'st-loc'; if(st==='Auto-école')return 'st-ae'; if(/^(Déclassé|Vendu)/.test(st))return 'st-off'; return 'st-check';}
function statusLabel(st){return st==='Non listé 2026'?'⚠ Absent des listes 2026':(st||'—');}
const META={'TPG':{label:'TPG',icon:'🚌',accent:'#7b9fff'},'GEMBUS':{label:'GEMBUS',icon:'🚌',accent:'#34c77b'},'GENEVE-TOURS':{label:'GENEVE-TOURS',icon:'🚌',accent:'#2ed8c3'},'GLOBE':{label:'GLOBE',icon:'🚌',accent:'#f5a623'},'ODIER':{label:'ODIER',icon:'🚌',accent:'#9b6dff'},'RATP':{label:'RATP',icon:'🚌',accent:'#ff5757'},'RDTA':{label:'RDTA',icon:'🚌',accent:'#8b94b0'}};
function getMeta(op){return META[op]||{label:op||'Inconnu',icon:'🚌',accent:'#8b94b0'}}
function countBy(field){const m=new Map(); VEHICLES.forEach(v=>m.set(v[field]||'Inconnu',(m.get(v[field]||'Inconnu')||0)+1)); return m}
function makeFilters(elId, field, activeGetter, setActive){const el=document.getElementById(elId); const counts=countBy(field); const values=[...counts.keys()].sort((a,b)=>a.localeCompare(b,'fr')); el.innerHTML=`<button class="filter-btn active" data-value=""><span>🚌 Tout</span><span class="filter-count">${VEHICLES.length}</span></button>`+values.map(x=>`<button class="filter-btn" data-value="${String(x).replaceAll('"','&quot;')}"><span>🚌 ${x}</span><span class="filter-count">${counts.get(x)}</span></button>`).join(''); el.addEventListener('click',e=>{const btn=e.target.closest('.filter-btn'); if(!btn)return; el.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); setActive(btn.dataset.value||null); render();})}
makeFilters('operator-filters','exploitant',()=>activeOperator,v=>activeOperator=v); makeFilters('type-filters','type',()=>activeType,v=>activeType=v);
const searchInput=document.getElementById('search-input'), clearBtn=document.getElementById('search-clear'); searchInput.addEventListener('input',()=>{query=searchInput.value.trim(); clearBtn.style.display=query?'block':'none'; render();}); clearBtn.addEventListener('click',()=>{searchInput.value='';query='';clearBtn.style.display='none';searchInput.focus();render();}); document.getElementById('sort-select').addEventListener('change',e=>{sortMode=e.target.value;render();}); document.getElementById('show-retired').addEventListener('change',e=>{showRetired=e.target.checked;render();});
function hl(text,q){if(!q)return String(text??''); const s=String(text??''); const i=s.toLowerCase().indexOf(q.toLowerCase()); return i<0?s:s.slice(0,i)+`<span class="hl">${s.slice(i,i+q.length)}</span>`+s.slice(i+q.length)}
function filteredVehicles(){const q=query.toLowerCase().replace(/\s+/g,' ').trim(); const qNo=q.replace(/\s/g,''); let a=VEHICLES.filter(v=>{if(activeOperator&&v.exploitant!==activeOperator)return false; if(activeType&&v.type!==activeType)return false; if(!showRetired&&isRetired(v)&&!(q&&String(v.parc)===q))return false; if(!q)return true; const parc=String(v.parc); const plaque=String(v.plaque||'').toLowerCase().replace(/\s+/g,' ').trim(); const plNo=plaque.replace(/\s/g,''); const extra=[v.alias,v.serie&&('série '+v.serie),v.depot,DEPOTS[v.depot],v.marque,v.modele,v.ligne].filter(Boolean).join(' ').toLowerCase(); return parc.includes(q)||String(v.alias||'').includes(q)||plaque.includes(q)||plNo.includes(qNo)||String(v.exploitant).toLowerCase().includes(q)||String(v.type).toLowerCase().includes(q)||extra.includes(q);}); a.sort((x,y)=>{if(sortMode==='exploitant')return (x.exploitant+x.type+x.parc).localeCompare(y.exploitant+y.type+y.parc,'fr'); if(sortMode==='type')return (x.type+x.exploitant+x.parc).localeCompare(y.type+y.exploitant+y.parc,'fr'); if(sortMode==='video')return Number(y.video)-Number(x.video)||x.parc-y.parc; if(sortMode==='places')return (y.places||0)-(x.places||0)||x.parc-y.parc; return x.parc-y.parc;}); return a}
function render(){const filtered=filteredVehicles(); document.getElementById('stats-bar').innerHTML=`<strong>${filtered.length}</strong> résultat${filtered.length>1?'s':''} <span class="stats-sep">·</span> sur ${VEHICLES.filter(v=>showRetired||!isRetired(v)).length} véhicules${showRetired?'':' en service'}`; const el=document.getElementById('results'); if(!filtered.length){el.innerHTML=`<div class="state-msg"><div class="state-icon">😶</div><div class="state-title">Aucun résultat</div><div class="state-sub">aucun véhicule correspondant</div></div>`; return;} el.innerHTML=filtered.map(v=>{const meta=getMeta(v.exploitant); const plaque=String(v.plaque||'').trim(); const hasPlate=plaque&&plaque!=='Non'&&plaque!=='—'; const pct=v.places?Math.round((v.places/MAX_PLACES)*100):0; return `<div class="veh-card${isRetired(v)?' retired':''}" style="--card-accent:${meta.accent}"><div class="veh-card-head"><div><div class="veh-parc">${hl(v.parc,query)}</div><div class="veh-parc-label">N° PARC</div>${v.alias?`<div class="veh-alias">n° court ${hl(v.alias,query)}</div>`:''}<span class="veh-status ${statusClass(v.statut)}">${statusLabel(v.statut)}</span></div><div class="veh-badge" style="background:${meta.accent}18;color:${meta.accent};border:1px solid ${meta.accent}30">${meta.icon} ${v.exploitant}</div></div><div class="veh-divider"></div><div class="veh-fields"><div class="veh-field"><span class="veh-field-label">Plaque</span><span class="veh-field-val ${hasPlate?'':'no-plate'}">${hasPlate?hl(plaque,query):'Non renseigné'}</span></div><div class="veh-field"><span class="veh-field-label">Places</span><div class="veh-places-bar">${v.places?`<div class="veh-places-track"><div class="veh-places-fill" style="width:${pct}%;background:${meta.accent}"></div></div>`:''}<span class="veh-places-num">${v.places||'—'}</span></div></div><div class="veh-field"><span class="veh-field-label">Famille</span><span class="veh-field-val">${v.type||'Inconnu'}</span></div><div class="veh-field"><span class="veh-field-label">Vidéosurveillance</span><span class="veh-field-val ${v.video?'video-yes':'video-no'}">${v.video?'Oui':'Non renseigné'}</span></div>${v.serie||v.depot?`<div class="veh-field"><span class="veh-field-label">Série / dépôt</span><span class="veh-field-val">${v.serie?'S'+v.serie:'—'}${v.depot?' · '+(DEPOTS[v.depot]||v.depot):''}</span></div>`:''}${v.marque||v.modele?`<div class="veh-field"><span class="veh-field-label">Modèle</span><span class="veh-field-val">${[v.marque,v.modele].filter(Boolean).join(' ')}</span></div>`:''}${v.mise_en_service?`<div class="veh-field"><span class="veh-field-label">Mise en service</span><span class="veh-field-val">${v.mise_en_service}</span></div>`:''}${v.ligne?`<div class="veh-field"><span class="veh-field-label">Ligne(s)</span><span class="veh-field-val">${v.ligne}</span></div>`:''}</div><div class="veh-card-footer"><span class="veh-type-label">${v.exploitant}</span><button class="veh-copy-btn" data-parc="${v.parc}">📋 Copier parc</button></div></div>`;}).join(''); el.querySelectorAll('.veh-copy-btn').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation(); navigator.clipboard.writeText(btn.dataset.parc).then(()=>{btn.textContent='✓ Copié !';btn.classList.add('copied');setTimeout(()=>{btn.textContent='📋 Copier parc';btn.classList.remove('copied')},1500)}).catch(()=>{})}));}
render();
</script></body></html>
